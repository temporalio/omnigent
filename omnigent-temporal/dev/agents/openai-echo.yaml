name: openai-echo
description: >-
  Smallest OpenAI-backed agent, for exercising the Temporal executor. It uses the
  openai-agents harness, which reads an ambient OPENAI_API_KEY, and it is not a
  native harness, so the runner-recovery path is reachable with it.

executor:
  harness: openai-agents
  # A non-reasoning model on purpose. With a reasoning model this harness replays
  # the transcript without the reasoning items its messages depend on, and the
  # second turn of a session fails with an OpenAI 400: "Item 'msg_...' was
  # provided without its required 'reasoning' item".
  model: gpt-4o-mini

prompt: |
  You are a terse assistant. Do exactly what the user asks and nothing more.
