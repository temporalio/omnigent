[project]
name = "omnigent-temporal"
version = "0.0.0"
description = "Temporal-backed durable executor for Omnigent sessions"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.8",
    "omnigent-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnigent_temporal"]
